<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPID Mini Market ERP Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#eef2f7;font:14px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0d131d;border-right:1px solid #253043;padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#9c111b,#4d0006);display:grid;place-items:center;font-weight:900}.muted{color:#8e99ad}.nav button{width:100%;border:0;background:transparent;color:#b8c1d0;padding:11px;border-radius:10px;text-align:left;margin:3px 0}.nav button.on,.nav button:hover{background:#17202e;color:white}.main{min-width:0}.top{height:70px;border-bottom:1px solid #253043;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:#090d14e8;z-index:5}.content{padding:22px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#111824;border:1px solid #253043;border-radius:16px;padding:16px;box-shadow:0 16px 45px #0005}.kpi b{font-size:24px;display:block;margin:6px 0}.green{color:#55dca9}.red{color:#ff7d85}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#1d2a3b;font-size:11px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.btn{border:1px solid #2a384c;background:#182332;color:white;padding:9px 11px;border-radius:10px}.primary{background:#8b0000}.blue{background:#075675}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid #253043;text-align:left}.wrap{overflow:auto}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.product{overflow:hidden;padding:0}.product img{width:100%;height:105px;object-fit:cover}.product .p{padding:11px}.pos{display:grid;grid-template-columns:1fr 340px;gap:14px}.cart{position:sticky;top:86px}.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #253043}.staff{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.notice{padding:12px;border:1px solid #155c75;background:#0a2632;border-radius:12px;margin-bottom:14px}.qr{display:grid;grid-template-columns:300px 1fr;gap:14px}.qr img{width:210px;background:white;padding:8px;border-radius:12px}.phone{max-width:390px;margin:auto;border:8px solid #273244;border-radius:28px;overflow:hidden;background:#0b111a}.phone h3{margin:0;padding:15px;background:#790009}.phone .body{padding:12px}.mini{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #253043}.mini img{width:54px;height:54px;object-fit:cover;border-radius:9px}.toast{position:fixed;right:20px;top:85px;background:#182332;border:1px solid #34445b;padding:11px 13px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1}.mobile{display:none}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:fixed;left:-250px;width:230px;z-index:10;transition:.2s}.side.open{left:0}.mobile{display:block}.kpis{grid-template-columns:repeat(2,1fr)}.two,.pos,.qr{grid-template-columns:1fr}.products{grid-template-columns:repeat(3,1fr)}.staff{grid-template-columns:repeat(2,1fr)}.cart{position:static}}@media(max-width:600px){.content{padding:12px}.products,.staff,.three{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:1fr}.top{padding:0 12px}.role{display:none}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">SP</div><div><b>SPID Systems</b><div class="muted">Mini Market ERP</div></div></div><div class="nav" id="nav"></div><div class="muted" style="position:absolute;bottom:18px">SPID — Speed. Security. Systems.<br>Client Demo • No production DB</div></aside><main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mobile" onclick="side.classList.toggle('open')">☰</button><div><b id="title">Dashboard</b><div class="muted" id="sub">Store operations snapshot</div></div></div><div><span class="pill green">● Demo Online</span> <select class="btn role"><option>Owner</option><option>Manager</option><option>Cashier</option><option>HR</option></select></div></header><div class="content" id="content"></div></main></div><div class="toast" id="toast"></div><script>
var pics=['https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80','https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=500&q=80','https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=500&q=80','https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=500&q=80','https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80','https://images.unsplash.com/photo-1575377427642-087cf684f29d?auto=format&fit=crop&w=500&q=80'];
var seed={products:[['Cappuccino','Coffee',75,29,42,12,pics[0]],['Turkey Sandwich','Fresh Food',120,58,18,8,pics[1]],['Mineral Water','Drinks',15,7,96,24,pics[2]],['Orange Juice','Drinks',55,24,31,10,pics[3]],['Potato Chips','Snacks',35,19,9,15,pics[4]],['Dark Chocolate','Snacks',48,26,7,12,pics[5]]],orders:[['ORD-1048','POS',286,'Completed'],['ORD-1047','QR',165,'Preparing'],['ORD-1046','POS',422,'Completed'],['ORD-1045','QR',135,'Ready']],staff:[['Mariam Adel','Cashier','On shift',7200],['Omar Nabil','Barista','On shift',6800],['Hassan Ali','Storekeeper','Break',7400],['Sara Mostafa','Supervisor','On shift',9800],['Ahmed Samy','Delivery','Off',6500],['Nour Emad','Cashier','Scheduled',7200]],counts:[['Daily','27 Sep 2026',-215],['Weekly','21 Sep 2026',340]],expenses:[['Utilities',420],['Packaging',275],['Staff meal',180]]};
var S=JSON.parse(localStorage.getItem('spidMiniERP')||'null')||JSON.parse(JSON.stringify(seed)),cart=[];function save(){localStorage.setItem('spidMiniERP',JSON.stringify(S))}function E(n){return new Intl.NumberFormat('en-EG',{style:'currency',currency:'EGP',maximumFractionDigits:0}).format(n)}function toast(x){var t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
var pages=[['dash','◈ Dashboard'],['pos','▣ POS & Checkout'],['orders','◫ Orders'],['inventory','▦ Inventory'],['counts','✓ Stock Counts'],['hr','♟ HR & Staff'],['accounting','₤ Accounting'],['qr','⌁ QR Ordering'],['reports','▥ Reports'],['settings','⚙ Settings']];document.getElementById('nav').innerHTML=pages.map(function(p){return '<button id="n-'+p[0]+'" onclick="go(\''+p[0]+'\')">'+p[1]+'</button>'}).join('');
function go(p){location.hash=p;render(p);side.classList.remove('open')}function render(p){p=p||location.hash.slice(1)||'dash';document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('on')});var nb=document.getElementById('n-'+p);if(nb)nb.classList.add('on');var f=window['v_'+p]||v_dash;content.innerHTML=f();if(p==='qr')setTimeout(qrCode,30)}window.onhashchange=function(){render()};
function ordersTable(){return '<div class="wrap"><table class="table"><tr><th>Order</th><th>Channel</th><th>Total</th><th>Status</th></tr>'+S.orders.map(function(o,i){return '<tr><td><b>'+o[0]+'</b></td><td>'+o[1]+'</td><td>'+E(o[2])+'</td><td><button class="btn" onclick="cycle('+i+')">'+o[3]+'</button></td></tr>'}).join('')+'</table></div>'}function cycle(i){var a=['Preparing','Ready','Completed'],x=a.indexOf(S.orders[i][3]);S.orders[i][3]=a[(x+1)%3];save();render('orders')}
function v_dash(){var rev=15170+S.orders.reduce(function(a,o){return a+o[2]},0),stock=S.products.reduce(function(a,p){return a+p[3]*p[4]},0),low=S.products.filter(function(p){return p[4]<=p[5]}).length;return '<div class="notice"><b>SPID Live Operations:</b> This demo behaves like a real ERP using local browser data. Final delivery will connect all devices to one database.</div><div class="grid kpis"><div class="card kpi"><span class="muted">Today Sales</span><b>'+E(rev)+'</b><span class="green">↑ 12.4%</span></div><div class="card kpi"><span class="muted">Gross Profit</span><b>'+E(Math.round(rev*.51))+'</b><span class="green">51% margin</span></div><div class="card kpi"><span class="muted">Inventory Value</span><b>'+E(stock)+'</b><span>'+S.products.length+' SKUs</span></div><div class="card kpi"><span class="muted">Orders Today</span><b>'+(S.orders.length+73)+'</b><span>POS + QR</span></div><div class="card kpi"><span class="muted">Low Stock</span><b>'+low+'</b><span class="red">Needs review</span></div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="toolbar"><b>Live Order Queue</b><button class="btn" onclick="go(\'orders\')">View all</button></div>'+ordersTable()+'</div><div class="card"><b>Operations Health</b><div class="item"><span>Daily count</span><span class="green">Closed</span></div><div class="item"><span>Staff on shift</span><b>'+S.staff.filter(function(x){return x[2]==='On shift'}).length+'</b></div><div class="item"><span>Cash variance</span><span class="green">EGP 0</span></div><div class="item"><span>QR adoption</span><b>28%</b></div></div></div>'}
function prodCards(){return S.products.map(function(p,i){return '<div class="card product"><img src="'+p[6]+'"><div class="p"><b>'+p[0]+'</b><div class="muted">'+p[1]+' • '+p[4]+' in stock</div><div class="toolbar"><b>'+E(p[2])+'</b><button class="btn primary" onclick="add('+i+')">+ Add</button></div></div></div>'}).join('')}function v_pos(){setTimeout(drawCart,0);return '<div class="toolbar"><div><b>Fast Checkout</b><div class="muted">Cashier flow with stock deduction</div></div><button class="btn" onclick="add(2);toast(\'Barcode recognized: Mineral Water\')">▤ Scan barcode</button></div><div class="pos"><div class="products">'+prodCards()+'</div><div class="card cart"><b>Current Basket</b><div id="cartBox"></div></div></div>'}function add(i){var x=cart.find(function(c){return c.i===i});if(x)x.q++;else cart.push({i:i,q:1});drawCart();toast(S.products[i][0]+' added')}function drawCart(){var b=document.getElementById('cartBox');if(!b)return;if(!cart.length){b.innerHTML='<p class="muted">No items yet.</p>';return}var total=0;b.innerHTML=cart.map(function(c){var p=S.products[c.i];total+=p[2]*c.q;return '<div class="item"><span>'+p[0]+' × '+c.q+'</span><b>'+E(p[2]*c.q)+'</b></div>'}).join('')+'<div class="item"><b>Total + VAT</b><b>'+E(Math.round(total*1.14))+'</b></div><button class="btn primary" style="width:100%" onclick="pay()">Pay & Complete</button>'}function pay(){cart.forEach(function(c){S.products[c.i][4]-=c.q});var t=cart.reduce(function(a,c){return a+S.products[c.i][2]*c.q},0);S.orders.unshift(['ORD-'+(1050+S.orders.length),'POS',Math.round(t*1.14),'Completed']);cart=[];save();render('pos');toast('Order completed')}
function v_orders(){return '<div class="toolbar"><div><b>Unified Orders</b><div class="muted">POS + QR in one queue</div></div><button class="btn blue" onclick="simOrder()">+ Simulate QR Order</button></div><div class="card">'+ordersTable()+'</div>'}function simOrder(){S.orders.unshift(['QR-'+(220+S.orders.length),'QR',[95,135,180,220][Math.floor(Math.random()*4)],'Preparing']);save();render('orders');toast('New QR order received')}
function v_inventory(){var value=S.products.reduce(function(a,p){return a+p[3]*p[4]},0);return '<div class="toolbar"><div><b>Inventory Control</b><div class="muted">Cost, margin, stock & reorder</div></div><button class="btn primary" onclick="restock()">+ Receive Stock</button></div><div class="grid three"><div class="card kpi"><span class="muted">Stock at Cost</span><b>'+E(value)+'</b></div><div class="card kpi"><span class="muted">Low Stock</span><b>'+S.products.filter(function(p){return p[4]<=p[5]}).length+'</b></div><div class="card kpi"><span class="muted">Active SKUs</span><b>'+S.products.length+'</b></div></div><div class="card" style="margin-top:14px"><div class="wrap"><table class="table"><tr><th>Product</th><th>Cost</th><th>Sell</th><th>Margin</th><th>Stock</th><th>Reorder</th></tr>'+S.products.map(function(p){return '<tr><td><b>'+p[0]+'</b><div class="muted">'+p[1]+'</div></td><td>'+E(p[3])+'</td><td>'+E(p[2])+'</td><td>'+Math.round((p[2]-p[3])/p[2]*100)+'%</td><td class="'+(p[4]<=p[5]?'red':'green')+'"><b>'+p[4]+'</b></td><td>'+p[5]+'</td></tr>'}).join('')+'</table></div></div>'}function restock(){S.products[4][4]+=20;S.products[5][4]+=20;S.products[2][4]+=30;save();render('inventory');toast('Supplier delivery posted')}
function v_counts(){return '<div class="toolbar"><div><b>Daily & Weekly Stock Count</b><div class="muted">Variance tracking and audit history</div></div><div><button class="btn blue" onclick="count(\'Daily\')">Daily Count</button> <button class="btn primary" onclick="count(\'Weekly\')">Weekly Count</button></div></div><div class="grid three"><div class="card kpi"><span class="muted">System Units</span><b>'+S.products.reduce(function(a,p){return a+p[4]},0)+'</b></div><div class="card kpi"><span class="muted">Last Variance</span><b class="red">'+E(S.counts[0][2])+'</b></div><div class="card kpi"><span class="muted">Shrinkage</span><b>0.38%</b></div></div><div class="card" style="margin-top:14px"><div class="wrap"><table class="table"><tr><th>Type</th><th>Date</th><th>Variance</th><th>Status</th></tr>'+S.counts.map(function(c){return '<tr><td>'+c[0]+'</td><td>'+c[1]+'</td><td>'+E(c[2])+'</td><td class="green">Closed</td></tr>'}).join('')+'</table></div></div>'}function count(t){var v=parseInt(prompt(t+' count variance in EGP (demo):','0')||0);S.counts.unshift([t,new Date().toLocaleDateString('en-GB'),v]);save();render('counts');toast(t+' count closed')}
function v_hr(){return '<div class="toolbar"><div><b>HR & Staff</b><div class="muted">Attendance, shifts & payroll</div></div><button class="btn">Shift Planner</button></div><div class="grid three"><div class="card kpi"><span class="muted">Headcount</span><b>'+S.staff.length+'</b></div><div class="card kpi"><span class="muted">On Shift</span><b>'+S.staff.filter(function(s){return s[2]==='On shift'}).length+'</b></div><div class="card kpi"><span class="muted">Payroll</span><b>'+E(S.staff.reduce(function(a,s){return a+s[3]},0))+'</b></div></div><div class="staff" style="margin-top:14px">'+S.staff.map(function(s,i){return '<div class="card"><b>'+s[0]+'</b><div class="muted">'+s[1]+'</div><div class="item"><span>Status</span><span>'+s[2]+'</span></div><div class="item"><span>Salary</span><b>'+E(s[3])+'</b></div><button class="btn" style="width:100%" onclick="staffStatus('+i+')">Clock / Status</button></div>'}).join('')+'</div>'}function staffStatus(i){var a=['On shift','Break','Off','Scheduled'],x=a.indexOf(S.staff[i][2]);S.staff[i][2]=a[(x+1)%4];save();render('hr')}
function v_accounting(){var sales=18560,exp=S.expenses.reduce(function(a,e){return a+e[1]},0),cogs=Math.round(sales*.43),net=sales-exp-cogs;return '<div class="toolbar"><div><b>Accounting & Cash</b><div class="muted">Sales, COGS, expenses and shift closing</div></div><button class="btn primary" onclick="toast(\'Shift closed • variance EGP 0\')">Close Shift</button></div><div class="grid kpis"><div class="card kpi"><span class="muted">Gross Sales</span><b>'+E(sales)+'</b></div><div class="card kpi"><span class="muted">COGS</span><b>'+E(cogs)+'</b></div><div class="card kpi"><span class="muted">Expenses</span><b>'+E(exp)+'</b></div><div class="card kpi"><span class="muted">Net</span><b>'+E(net)+'</b></div><div class="card kpi"><span class="muted">Expected Cash</span><b>'+E(10810)+'</b></div></div><div class="grid two" style="margin-top:14px"><div class="card"><b>Payment Mix</b><div class="item"><span>Cash</span><b>'+E(6930)+'</b></div><div class="item"><span>Card</span><b>'+E(8245)+'</b></div><div class="item"><span>QR / Wallet</span><b>'+E(3385)+'</b></div></div><div class="card"><b>Expenses</b>'+S.expenses.map(function(e){return '<div class="item"><span>'+e[0]+'</span><b>'+E(e[1])+'</b></div>'}).join('')+'<button class="btn" onclick="expense()">+ Add Expense</button></div></div>'}function expense(){var n=prompt('Expense name','Store supplies'),a=parseInt(prompt('Amount','150')||0);if(n&&a){S.expenses.unshift([n,a]);save();render('accounting')}}
function v_qr(){return '<div class="notice"><b>QR Ordering:</b> customer menu works on mobile. Final version will sync orders live between customer, cashier and manager devices.</div><div class="qr"><div class="card" style="text-align:center"><b>Store QR</b><p><img id="qrimg"></p><button class="btn primary" onclick="simOrder()">Place Demo QR Order</button></div><div class="card"><div class="phone"><h3>SPID Mini Market</h3><div class="body">'+S.products.slice(0,5).map(function(p){return '<div class="mini"><img src="'+p[6]+'"><div><b>'+p[0]+'</b><div class="muted">'+E(p[2])+'</div></div><button class="btn">+</button></div>'}).join('')+'</div></div></div></div>'}function qrCode(){document.getElementById('qrimg').src='https://api.qrserver.com/v1/create-qr-code/?size=420x420&data='+encodeURIComponent(location.href)}
function v_reports(){return '<div class="toolbar"><div><b>Reports & Analytics</b><div class="muted">Management-ready KPIs</div></div><button class="btn" onclick="toast(\'Report export prepared\')">Export Report</button></div><div class="grid three"><div class="card kpi"><span class="muted">Average Basket</span><b>'+E(186)+'</b></div><div class="card kpi"><span class="muted">Peak Hour</span><b>18:00</b></div><div class="card kpi"><span class="muted">Avg Prep Time</span><b>4m 12s</b></div></div><div class="card" style="margin-top:14px"><b>Weekly Sales Trend</b><div style="display:flex;align-items:end;height:220px;gap:12px;margin-top:15px">'+[55,68,62,82,76,95,88].map(function(v,i){return '<div style="flex:1;background:linear-gradient(#00aeef,#075675);height:'+v+'%;border-radius:8px 8px 0 0;text-align:center"><small>'+['M','T','W','T','F','S','S'][i]+'</small></div>'}).join('')+'</div></div>'}
function v_settings(){return '<div class="grid two"><div class="card"><b>Store Profile</b><div class="item"><span>Store</span><b>SPID Mini Market Demo</b></div><div class="item"><span>Branch</span><b>Cairo — Demo</b></div><div class="item"><span>VAT</span><b>14%</b></div><div class="item"><span>Developer</span><b>SPID</b></div></div><div class="card"><b>Demo Tools</b><p class="muted">Reset all local demo data to the original state.</p><button class="btn primary" onclick="localStorage.removeItem(\'spidMiniERP\');location.reload()">Reset Demo</button></div></div>'}render();
</script></body></html>
